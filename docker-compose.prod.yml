version: '3.9'

services:
    
    schedule-service:
        build:
            context: ./
            dockerfile: ./back/ScheduleService/Dockerfile
        ports:
            - 6006:80
        restart: on-failure
        environment:
            ASPNETCORE_ENVIRONMENT: Prod
    
    sd-service:
        build:
            context: ./
            dockerfile: ./back/SDService/Dockerfile
        ports:
            - 6003:80
        restart: on-failure
        environment:
            ASPNETCORE_ENVIRONMENT: Prod
            
    transport-service:
        build:
            context: ./
            dockerfile: ./back/TransportService/Dockerfile
        ports:
            - 6005:80
        restart: on-failure
        environment:
            ASPNETCORE_ENVIRONMENT: Prod
            
    report-service:
        build:
            context: ./
            dockerfile: ./back/ReportService/Dockerfile
        ports:
            - 6009:80
        restart: on-failure
        environment:
            ASPNETCORE_ENVIRONMENT: Prod

    dispatcher-service:
        build:
            context: ./
            dockerfile: ./back/DispatcherService/Dockerfile
        ports:
            - 6010:80
        restart: on-failure
        environment:
            ASPNETCORE_ENVIRONMENT: Prod
        
    logist-service:
        build:
            context: ./
            dockerfile: ./back/LogistService/Dockerfile
        ports:
            - 6007:80
        restart: on-failure
        environment:
            ASPNETCORE_ENVIRONMENT: Prod
            
    mission-service:
        build:
            context: ./
            dockerfile: ./back/MissionService/Dockerfile
        ports:
            - 6008:80
        restart: on-failure
        environment:
            ASPNETCORE_ENVIRONMENT: Prod

    auth-service:
        build:
            context: ./
            dockerfile: ./back/AuthService/AuthService/Dockerfile
        ports:
            - 6004:80
        restart: on-failure
        environment:
            ASPNETCORE_ENVIRONMENT: Prod          
    
    external-api:
        build:
            context: ./
            dockerfile: ./back/ExternalApiService/ExternalApiService/Dockerfile
        ports:
            - 7003:80
        restart: on-failure
        environment:
            ASPNETCORE_ENVIRONMENT: Prod
            
    green-city-front:
        build:
            context: ./
            dockerfile: ./nuxt-front/Dockerfile
        ports:
            - 80:80
        volumes:
            - nginx-config-data:/etc/nginx/conf.d
        restart: on-failure
        depends_on:
            - external-api
          
volumes:
    nginx-config-data:
